<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TsuperHero – Gameplay</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/game.css?v=25">
</head>
<body>
  <div id="stage">
    <!-- Layer 1: Scrolling Road / Destination Landmark Still Frame -->
    <div id="windshield">
      <img id="road-img" src="../assets/RoadLoop.gif" alt="Philippine Road">
      <canvas id="road-freeze" hidden aria-hidden="true"></canvas>
    </div>

    <!-- Layer 2: Jeepney Interior & Steering Wheel -->
    <img id="jeep-interior" src="../assets/JeepInterior.png" alt="Jeepney Interior">

    <!-- Layer 3: Animated Driver Left Hand -->
    <img id="driver-hand" src="../assets/DriverHand.gif" alt="Driver Hand">
    <canvas id="hand-freeze" hidden aria-hidden="true"></canvas>

    <!-- Top Gray Header Bar (SCORE, STREAK, Hints, MENU) -->
    <div id="top-bar">
      <div class="hud-left">
        <span id="hud-score-wrap" class="hud-stat">SCORE: <b id="hud-score">0</b></span>
        <span id="hud-streak-wrap" class="hud-stat">STREAK: <b id="hud-streak">0</b></span>
      </div>
      <div class="hud-right">
        <span id="hud-hint-top" hidden>HINTS: <b class="hint-x">x<span id="hint-count">3</span></b></span>
        <button id="btn-menu" type="button"><span>MENU</span></button>
      </div>
    </div>

    <!-- Top-Left Windshield Icons: Taripa & Salita ng Tsuper -->
    <div id="side-tabs">
      <button id="tab-taripa" class="icon-btn" type="button" data-panel="taripa" title="Taripa (Fare Matrix)">
        <img src="../assets/TariffIcon.png" alt="Taripa">
      </button>
      <button id="tab-salita" class="icon-btn" type="button" data-panel="salita" title="Salita ng Tsuper">
        <img src="../assets/TranslationsIcon.png" alt="Salita ng Tsuper">
      </button>
    </div>

    <!-- Slide-out Drawer for Taripa & Salita ng Tsuper -->
    <div id="drawer" hidden>
      <div id="panel-taripa" hidden>
        <div class="drawer-head">
          <h3>Taripa (Fare Matrix)</h3>
          <button id="drawer-close" class="drawer-close" type="button">&times; Close</button>
        </div>
        <table id="fare-table"></table>
      </div>
      <div id="panel-salita" hidden>
        <div class="drawer-head">
          <h3>Salita ng Tsuper</h3>
          <button class="drawer-close" type="button" onclick="document.getElementById('drawer-close').click()">&times; Close</button>
        </div>
        <ul id="word-list"></ul>
      </div>
    </div>

    <!-- Top-Right Payment Display Box (SukliContainer.png) + SUKLIAN / SAKTO NA -->
    <div id="payment-area">
      <div id="payment-box">
        <div id="pay-cell-bayad" class="pay-cell">
          <div class="pay-lbl">BAYAD:</div>
          <div id="paid-amount" class="pay-val">0</div>
        </div>
        <div id="pay-cell-sukli" class="pay-cell">
          <div class="pay-lbl">SUKLI:</div>
          <div id="given-amount" class="pay-val">0</div>
        </div>
      </div>
      <div id="pay-actions" class="pay-actions">
        <button id="btn-suklian" class="pixel-action-btn" type="button">SUKLIAN</button>
        <button id="btn-sakto" class="pixel-action-btn" type="button">SAKTO NA</button>
      </div>
    </div>

    <!-- Passenger Pixel Speech Bubble & Fare Question Choices -->
    <div id="speech-area">
      <div id="speech-bubble" hidden>
        <p id="speech-text"></p>
        <div id="speech-note"></div>
      </div>
      <div id="choices" hidden>
        <button type="button" class="choice" data-value="20">BENTE</button>
        <button type="button" class="choice" data-value="10">DIYES</button>
        <button id="btn-hint" type="button" title="Use Hint">
          <img src="../assets/hint_question.png" alt="Use Hint">
        </button>
      </div>
    </div>

    <!-- Lives (hearts.png) & Timer Bar (progress_bar_filled.png) Perched Above Money Box -->
    <div id="status-above-tray">
      <div id="hud-lives" title="Lives"></div>
      <div id="timer-bar-wrap">
        <div id="timer-fill"></div>
      </div>
    </div>

    <!-- Bottom-Right Money Container (MoneyContainer.png) -->
    <div id="tray-box">
      <div id="tray-bills" class="tray-bills"></div>
      <div id="tray-coins" class="tray-coins"></div>
      <div id="tray-tools" class="tray-tools">
        <button id="btn-undo" type="button">UNDO</button>
        <button id="btn-clear" type="button">CLEAR</button>
      </div>
    </div>

    <!-- SAMPLE C Dynamic Bottom Route Progress Bar -->
    <div id="bottom-route-bar">
      <div id="hud-stage" class="bottom-badge">LVL 0</div>
      <div id="route-track-wrap">
        <div class="track-line">
          <div id="progress-fill"></div>
        </div>
        <img id="mini-jeepney" src="../assets/MiniJeepney.png" alt="Jeepney">
        <div id="progress-stops"></div>
      </div>
    </div>

    <!-- Guided Tutorial Step Card -->
    <div id="tutorial-bar" hidden>
      <span id="tut-title">Tutorial</span>
      <p id="tut-text"></p>
      <div class="tut-actions">
        <button id="tut-skip" type="button">Skip Tutorial</button>
        <button id="tut-next" type="button">Next &rarr;</button>
      </div>
    </div>

    <!-- Wrong / Retry Feedback Toast -->
    <div id="feedback" hidden>
      <div id="feedback-text"></div>
      <button id="feedback-btn" type="button" hidden>Next &rarr;</button>
    </div>

    <!-- Fade-to-Black Stop Transition Curtain & Endless Day Banner -->
    <div id="fade-curtain">
      <div id="day-banner" hidden>
        <div id="day-banner-title">DAY 1</div>
        <div id="day-banner-sub" hidden></div>
        <div id="day-banner-lives-wrap">
          <div id="day-banner-hearts" aria-label="Lives Remaining"></div>
          <div id="day-banner-lives-text">LIVES LEFT: 5 / 5</div>
        </div>
      </div>
    </div>
    <script>if (new URLSearchParams(location.search).get('stage')?.startsWith('endless-')) document.getElementById('fade-curtain').classList.add('instant', 'dark');</script>

    <!-- MENU & Settings Modal -->
    <div id="modal-menu" class="modal-backdrop" hidden>
      <div class="modal-card">
        <h2>Menu &amp; Settings</h2>
        <div class="setting-row">
          <label for="set-volume">Volume</label>
          <input id="set-volume" type="range" min="0" max="100" value="80">
        </div>
        <div class="setting-row">
          <label for="set-sfx">Sound Effects</label>
          <input id="set-sfx" type="checkbox" checked>
        </div>
        <div class="modal-btns">
          <button type="button" data-start-stage="tutorial">Replay Tutorial (Level 0)</button>
          <button id="menu-restart-stage" type="button" data-start-stage="level1">Restart Level 1</button>
          <button type="button" class="secondary" onclick="location.href='./login.html?section=gamemode'">Choose Gamemode</button>
          <button type="button" class="secondary" onclick="location.href='./login.html?section=menu'">Back to Main Menu</button>
          <button id="menu-close" type="button" class="secondary">Resume Game</button>
        </div>
        <div class="meta-footer">
          <span id="account-badge">Guest Mode</span>
          <span id="version-label">v0.2.0-dev</span>
        </div>
      </div>
    </div>

    <!-- Post-Game Screen Modal -->
    <div id="modal-postgame" class="modal-backdrop" hidden>
      <div class="modal-card">
        <h2 id="pg-title">You're Ready!</h2>
        <p id="pg-body"></p>
        <div id="pg-stats" hidden>
          <div class="setting-row"><span>Score Earned:</span><b id="pg-score">0</b></div>
          <div class="setting-row"><span>Highest Streak:</span><b id="pg-streak">0</b></div>
        </div>
        <div class="modal-btns">
          <button id="pg-primary" type="button">Start Level 1</button>
          <button id="pg-menu" type="button" class="secondary">Back to Main Menu</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../js/game/main.js?v=26"></script>
</body>
</html>
